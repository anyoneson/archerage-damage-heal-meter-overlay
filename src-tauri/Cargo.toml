[package]
name = "archerage_meter_overlay"
version = "0.1.0"
description = "ArcheRage damage and heal meter overlay"
authors = ["Xizde"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "archerage_meter_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
once_cell = "1.21.3"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.2", features = [] }
